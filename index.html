<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حديقة لبيبة</title>
<meta name="theme-color" content="#b07be8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مغامرة لبيبة">
<meta name="format-detection" content="telephone=no">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Lemonada:wght@600;700&display=swap" rel="stylesheet">
<style>
/* مغامرة فارس: لعبة منصّات. غابة ليلية، دروع ذهبية، أزرار بارزة */
:root{color-scheme:dark;--teal:#0f9d9a;--teal-d:#0b6e75;--orange:#ff8a3d;--orange-d:#c9611f;--yellow:#ffd34e;--yellow-d:#d9a91c;--pink:#ff6f91;--pink-d:#c94a6b;--violet:#6c5ce7;--violet-d:#4b3db8;--blue:#1e88e5;--blue-d:#1565c0;--ink:#1d2b3a;--card:#fffdf7;--ok:#2ecc71;--no:#ff5b5b;--txt:#fff;--bg1:#0d3b2c;--bg2:#123a4a;
--disp:'Lemonada','Cairo',Tahoma,sans-serif;--body:'Cairo','Segoe UI',Tahoma,Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
html,body{min-height:100%}
body{margin:0;font-family:var(--body);color:var(--txt);background:radial-gradient(ellipse at 50% -10%,#2f8f5b 0%,transparent 55%),radial-gradient(circle at 100% 100%,#0f5a5a 0%,transparent 45%),linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding-block:12px 24px}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.screen{animation:fadein .28s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.b3d{border:0;border-radius:18px;color:#fff;font-weight:900;padding:10px 24px;font-size:18px;background:var(--c,var(--teal));box-shadow:0 6px 0 var(--cd,var(--teal-d)),0 10px 18px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.b3d:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--cd,var(--teal-d))}
.b3d:disabled{opacity:.5;cursor:default}
.b3d.y{--c:var(--yellow);--cd:var(--yellow-d);color:var(--ink);text-shadow:none}
.b3d.p{--c:var(--pink);--cd:var(--pink-d)}.b3d.o{--c:var(--orange);--cd:var(--orange-d)}.b3d.g{--c:#3d5a73;--cd:#26394a}.b3d.v{--c:var(--violet);--cd:var(--violet-d)}
.btns{display:flex;justify-content:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.hdr{background:#fff;border-radius:14px;padding:4px 10px;margin:0 auto 10px;max-width:520px}
.hdr img{display:block;margin:0 auto;height:52px;max-width:100%;object-fit:contain}
.logo{text-align:center;margin:4px 0}
.crest{display:inline-grid;place-items:center;width:70px;height:78px;background:linear-gradient(160deg,var(--yellow),var(--orange));clip-path:polygon(50% 0,100% 14%,100% 58%,50% 100%,0 58%,0 14%);font-size:36px;filter:drop-shadow(0 4px 0 var(--orange-d))}
.logo h1{font-family:var(--disp);font-weight:700;font-size:clamp(30px,6.4vw,50px);line-height:1.25;margin:2px 0 0;color:var(--yellow);text-shadow:0 4px 0 var(--orange-d),0 8px 18px rgba(0,0,0,.45);text-wrap:balance}
.logo p{margin:2px 0 0;font-weight:800;color:#c8f1dd}
.panel{background:rgba(0,0,0,.25);border:2px solid rgba(255,211,78,.35);border-radius:20px;padding:12px 14px}
.card{background:var(--card);color:var(--ink);border-radius:22px;padding:14px 16px;border:4px solid var(--yellow);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.card h2{font-family:var(--disp);font-weight:700;font-size:24px;margin:0 0 6px;color:var(--teal-d);line-height:1.4}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:999px;padding:2px 12px;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.y{background:var(--yellow);color:var(--ink)}
.player select{flex:1;min-width:0;font:inherit;font-weight:800;font-size:17px;padding:8px 12px;border-radius:14px;border:3px solid var(--orange);background:#fff;color:var(--ink)}
.player label{font-weight:900;color:var(--yellow)}
.warn{margin:6px 0 0;color:#ffc2cf;font-weight:700;font-size:14px}
.avbox{flex:none;width:76px;height:92px;border-radius:18px;background:radial-gradient(circle at 50% 30%,#3a8f6a,#174d3c);border:3px solid var(--yellow);display:grid;place-items:end center;overflow:hidden}
.avbox img{display:block;width:100%;height:auto}
.mini-av{width:26px;height:31px;border-radius:8px;background:#174d3c;vertical-align:middle}
.xp{height:10px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden;margin:4px 0}.xp div{height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange))}
.credits{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:18px;font-weight:700;font-size:13.5px;color:#a9d6c3;border-top:1px dashed rgba(255,255,255,.2);padding-top:8px}
.toplinks{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.ghost{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:4px 16px;font-weight:800}
/* غرفة الشخصية */
.room{display:grid;grid-template-columns:240px 1fr;gap:14px;align-items:start}
.stage{position:sticky;top:10px;background:radial-gradient(circle at 50% 35%,#3a8f6a,#123a2e);border:4px solid var(--yellow);border-radius:24px;padding:10px;text-align:center}
.stage canvas{display:block;margin:0 auto;max-width:100%}
.stage b{display:block;font-family:var(--disp);color:var(--yellow);font-size:20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:2px solid var(--yellow);background:transparent;color:var(--yellow);border-radius:999px;padding:3px 14px;font-weight:900}
.tab[aria-selected="true"]{background:var(--yellow);color:var(--ink)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px}
.opt{position:relative;border:3px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);border-radius:16px;padding:6px 4px;color:#fff;font-weight:800;font-size:13px;line-height:1.3;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.opt .sw{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.8)}
.opt .em{font-size:28px;line-height:1}
.opt[aria-pressed="true"]{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,211,78,.35);background:rgba(255,211,78,.15)}
.opt.lock{opacity:.6}
.opt .tag{position:absolute;top:-8px;left:-6px;background:var(--pink);color:#fff;border-radius:999px;padding:0 7px;font-size:11px;box-shadow:0 2px 0 var(--pink-d)}
.opt .tag.c{background:var(--yellow);color:var(--ink);box-shadow:0 2px 0 var(--yellow-d)}
.opt .tag.t{background:var(--violet);box-shadow:0 2px 0 var(--violet-d)}
.note{font-size:13.5px;font-weight:700;color:#c8f1dd;margin:8px 0 0}
/* خريطة العوالم */
.island{margin-top:16px}
.island h3{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--disp);font-weight:700;font-size:22px;color:var(--ink);background:linear-gradient(90deg,transparent,var(--yellow) 12%,var(--yellow) 88%,transparent);padding:4px 10px;border-radius:6px;margin:0 auto 6px;max-width:420px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.mapwrap{position:relative;border-radius:24px;overflow:hidden;border:4px solid rgba(255,211,78,.5)}
.mapwrap canvas{display:block;width:100%;height:auto}
.node{position:absolute;transform:translate(-50%,-50%);width:70px;border:0;background:transparent;padding:0;color:#fff;text-align:center}
.node .disc{display:grid;place-items:center;width:58px;height:58px;margin:0 auto;border-radius:50%;background:var(--c,var(--teal));border:4px solid #fff;box-shadow:0 5px 0 var(--cd,var(--teal-d)),0 8px 14px rgba(0,0,0,.35);font-size:26px;position:relative}
.node .num{position:absolute;top:-8px;right:-8px;background:var(--yellow);color:var(--ink);border-radius:999px;font-size:12px;font-weight:900;padding:0 6px;border:2px solid #fff}
.node .lbl{display:block;margin-top:6px;font-weight:900;font-size:12.5px;line-height:1.25;text-shadow:0 2px 3px rgba(0,0,0,.8)}
.node .st{display:block;font-size:12px;letter-spacing:1px;line-height:1}
.node.locked .disc{filter:grayscale(1) brightness(.7)}
.node.boss .disc{width:68px;height:68px;font-size:32px;--c:var(--violet);--cd:var(--violet-d)}
.node.here .disc::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px dashed var(--yellow);animation:spin 6s linear infinite}
/* شاشة العالم والمراحل */
.rule p{margin:0;font-weight:700;font-size:16px;line-height:1.85}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center}
.chips span{background:#fff4e8;border:2.5px solid var(--orange);border-radius:999px;padding:2px 14px;font-weight:800}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.stg{border:0;border-radius:20px;padding:14px 6px;color:#fff;background:var(--c);box-shadow:0 6px 0 var(--cd),0 10px 18px rgba(0,0,0,.3);text-align:center;font-weight:900}
.stg .ic{display:block;font-size:34px}.stg small{display:block;font-weight:700;opacity:.9}
.stg.locked{filter:grayscale(1) brightness(.7)}
/* شاشة اللعب */
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(0,0,0,.32);border:1px solid rgba(255,211,78,.25);border-radius:18px;padding:6px 10px}
.hud .sp{margin-inline-start:auto}
.hearts{font-size:18px;letter-spacing:1px}.hearts .lost{filter:grayscale(1);opacity:.3}
.q{background:var(--card);color:var(--ink);border-radius:16px;padding:6px 12px;text-align:center;margin:8px 0;border:3px solid var(--yellow)}
.q small{display:block;font-weight:900;color:var(--teal-d);font-size:14px}
.q div{font-size:clamp(18px,4.4vw,24px);font-weight:900;line-height:1.6}
.gap{display:inline-block;min-width:70px;border-bottom:4px dashed var(--orange);color:var(--orange)}
.view{position:relative;width:max-content;max-width:100%;margin:0 auto;border-radius:16px;overflow:hidden;border:4px solid var(--teal);box-shadow:0 10px 24px rgba(0,0,0,.35);touch-action:none}
.view canvas{display:block;max-width:100%}
.over{position:absolute;inset:0;overflow:auto;background:rgba(10,40,30,.84);display:grid;place-items:center;text-align:center;padding:14px}
.over b{display:block;font-size:19px;margin:4px 0}.over p{margin:0 0 10px;font-size:14px;color:#c8f1dd}
.pad{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px auto 0;max-width:560px;user-select:none;-webkit-user-select:none}
.pad div{display:flex;gap:10px}.pad .b3d{height:70px;width:80px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;padding:0;font-size:26px;touch-action:none}.pad .jbtn{width:136px;font-size:22px}
/* النتيجة */
.end{text-align:center}
.stars{font-size:56px;letter-spacing:8px;line-height:1.1}.stars span{color:rgba(255,255,255,.18)}
.stars .lit{color:var(--yellow);text-shadow:0 4px 0 var(--orange-d);display:inline-block;animation:pop .5s backwards}
.stars .lit:nth-child(2){animation-delay:.2s}.stars .lit:nth-child(3){animation-delay:.4s}
.end h2{font-family:var(--disp);font-weight:700;font-size:26px;margin:6px 0;color:#fff;line-height:1.5}
.grade{display:inline-flex;flex-direction:column;align-items:center;background:var(--card);color:var(--ink);border-radius:22px;padding:6px 26px;border:4px solid var(--pink);box-shadow:0 6px 0 var(--pink-d)}
.grade small{font-weight:800;color:var(--pink-d)}.grade b{font-family:var(--disp);font-size:40px;line-height:1.3;font-variant-numeric:tabular-nums}
.loot{margin:12px auto 0;max-width:560px;background:rgba(255,255,255,.08);border:2px dashed var(--yellow);border-radius:18px;padding:8px 12px}
.loot h3{margin:0;font-family:var(--disp);font-weight:700;color:var(--yellow);font-size:20px}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.bdg{border-radius:16px;padding:8px 6px;text-align:center;background:#eef2f3;border:2px dashed #c9d3d7;color:#7d8b95;line-height:1.4}
.bdg .bi{display:block;font-size:32px;filter:grayscale(1);opacity:.6}.bdg b{display:block;font-size:14px}.bdg small{display:block;font-size:12px;font-weight:600}
.bdg.got{background:linear-gradient(160deg,#fff6d6,#ffe9b0);border:2px solid var(--yellow);color:var(--ink);box-shadow:0 4px 0 var(--yellow-d)}.bdg.got .bi{filter:none;opacity:1}
/* منصّة الأبطال */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end;margin-top:16px}
.pcol{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pav{width:80px;border-radius:18px;background:radial-gradient(circle at 50% 30%,#3a8f6a,#174d3c);border:3px solid var(--yellow);max-width:100%}
.pav.first{width:96px;border-color:#f2c230;box-shadow:0 0 0 4px rgba(242,194,48,.35)}
.pav.empty{height:96px;display:grid;place-items:center;font-size:36px;color:rgba(255,255,255,.4)}
.pn{font-size:14px;line-height:1.3;max-width:100%;overflow-wrap:anywhere}
.pblk{width:100%;border-radius:14px 14px 0 0;background:linear-gradient(180deg,var(--pc),rgba(0,0,0,.25));display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;box-shadow:inset 0 4px 0 rgba(255,255,255,.4)}
.pm{font-size:34px;line-height:1}.pr{font-family:var(--disp);font-size:30px;font-weight:700;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}

/* إعادة الإعدادات */
.rsbox{margin-top:12px;background:#fff4e8;border:3px solid var(--line,#2b1a0e);border-radius:12px;padding:10px 12px}
.rsbox h3{margin:0 0 6px;font-family:var(--disp);font-weight:700;color:#c0392b;font-size:20px}
.rsgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rsitem{display:flex;flex-direction:column;gap:6px;background:#fff;border:2px solid #e2d3c0;border-radius:12px;padding:8px 10px}
.rsitem.ask{border-color:#c62828;background:#fff1f1}
.rsitem b{color:var(--ink)}.rsitem small{color:#5b4a3a;font-weight:600;line-height:1.6}
.rsitem select{font:inherit;font-weight:700;padding:4px 8px;border-radius:10px;border:2px solid var(--line,#2b1a0e);color:var(--ink);background:#fff}
.rsitem .b3d{font-size:15px;padding:6px 12px;align-self:flex-start}
.rsok{margin:0 0 8px;background:#e6f9ee;border:2px solid #1e8e4e;border-radius:10px;padding:4px 10px;font-weight:800;color:#1e7a46}
@media (max-width:620px){.rsgrid{grid-template-columns:1fr}}
/* صفحة المعلم */
.rp h1{font-family:var(--disp);font-weight:700;font-size:28px;margin:0;color:var(--teal-d)}
.rp .meta{margin:0;color:#4b5b68;font-weight:700;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.kpi{border-radius:16px;padding:6px 10px;text-align:center;background:#eaf8f7;border:2px solid #bfe6e4}
.kpi b{display:block;font-family:var(--disp);font-size:26px;line-height:1.3;color:var(--teal-d);font-variant-numeric:tabular-nums}.kpi span{font-weight:700;font-size:13px;color:#4b5b68}
.rtabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.rtab{border:2px solid var(--teal);background:#fff;color:var(--teal-d);border-radius:999px;padding:2px 16px;font-weight:800}
.rtab[aria-selected="true"]{background:var(--teal);color:#fff}
.scroll{overflow-x:auto;border-radius:14px;border:2px solid #e2ecee}
table.res{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.res th{background:var(--teal-d);color:#fff;font-weight:800;padding:6px 8px;text-align:right}
.res td{padding:5px 8px;border-top:1px solid #edf2f3;font-weight:600;font-variant-numeric:tabular-nums}
.res tr:nth-child(even) td{background:#f7fbfb}.res td.c,.res th.c{text-align:center}
.sc{display:inline-block;min-width:44px;text-align:center;border-radius:999px;padding:0 8px;font-weight:900}
.s3{background:#d9f5e5;color:#1e7a46}.s2{background:#fff1c7;color:#8a6400}.s1{background:#ffe3d1;color:#a24a12}.s0{background:#ffe0e0;color:#b33}.sn{color:#9aa7b0}
.empty{text-align:center;padding:18px;font-weight:700;color:#4b5b68}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#ffe9e9;border:2px solid var(--no);border-radius:14px;padding:6px 10px;font-weight:800}
.float{position:fixed;font-family:var(--disp);font-size:28px;color:var(--yellow);text-shadow:0 3px 0 var(--orange-d);pointer-events:none;z-index:40;animation:up 1.1s ease-out forwards}
.confetti{position:fixed;top:-14px;width:10px;height:14px;border-radius:2px;pointer-events:none;z-index:50;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@keyframes pop{0%{transform:scale(.88);opacity:.3}100%{transform:scale(1);opacity:1}}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:620px){.room{grid-template-columns:1fr}.stage{position:static}.kpis{grid-template-columns:repeat(2,1fr)}.bgrid{grid-template-columns:repeat(2,1fr)}.node{width:62px}.node .disc{width:50px;height:50px;font-size:22px}.node.boss .disc{width:58px;height:58px}.node .lbl{font-size:11px}}


/* ===== طابع ألعاب المنصّات الكلاسيكية: سماء نهارية، مكعبات بإطار داكن ===== */
:root{--line:#2b1a0e;--brick:#b5652b;--brick-d:#7a3e17;--sky-a:#4fa8ff;--sky-b:#9fdcff}
body{background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 70%,#d8f1ff 100%);background-attachment:fixed}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:90px;pointer-events:none;z-index:-1;background:
 radial-gradient(70px 46px at 12% 100%,#3fae49 98%,transparent 100%),radial-gradient(110px 70px at 38% 100%,#4cc057 98%,transparent 100%),radial-gradient(80px 50px at 70% 100%,#3fae49 98%,transparent 100%),radial-gradient(120px 64px at 95% 100%,#4cc057 98%,transparent 100%),linear-gradient(180deg,transparent 70px,#3a9a43 70px)}
.wrap{text-shadow:0 2px 0 rgba(0,0,0,.35)}
.logo h1{color:#ffd34e;text-shadow:3px 0 0 var(--line),-3px 0 0 var(--line),0 3px 0 var(--line),0 -3px 0 var(--line),2px 2px 0 var(--line),-2px -2px 0 var(--line),2px -2px 0 var(--line),-2px 2px 0 var(--line),0 8px 0 #c9611f}
.logo p{color:#fff;text-shadow:2px 0 0 var(--line),-2px 0 0 var(--line),0 2px 0 var(--line),0 -2px 0 var(--line)}
.crest{background:linear-gradient(160deg,#ffe066,#f2a900);filter:drop-shadow(0 0 0 var(--line)) drop-shadow(3px 3px 0 var(--line)) drop-shadow(-3px -3px 0 var(--line))}
.b3d{border:3px solid var(--line);border-radius:12px;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.25),0 5px 0 var(--line)}

const KEY=C.id+'-settings';

const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

/* ---------- موسيقى الخلفية (تُولَّد داخل الصفحة) ---------- */
let mctx=null,mg=null,timer=null,step=0,nextT=0,started=false;

const MEL=[76,79,84,79,77,81,84,81,76,79,83,86,84,79,76,74, 72,76,79,76,74,77,81,77,79,76,74,72,71,74,79,null,
           76,null,79,81,79,76,72,null,74,77,81,77,76,74,72,null,72,76,79,84,83,81,79,77,76,74,72,74,72,null,null,null];
const BAS=[48,55,52,55,53,57,60,57,48,55,52,55,55,59,62,59, 45,52,48,52,53,57,60,57,55,59,62,59,48,55,48,null,
           48,55,52,55,53,57,60,57,50,53,57,53,55,59,62,59,45,52,48,52,53,57,60,57,55,59,55,50,48,null,48,null];
const _=null;
const TRACKS={
 menu:{bpm:118,mel:MEL,bas:BAS,lead:'square',hat:1},
 plains:{bpm:124,lead:'square',hat:1,mel:[72,_,76,79,_,76,81,79,77,_,74,_,72,_,_,_,74,_,77,81,_,79,77,76,74,_,71,_,72,_,_,_],bas:[48,_,55,_,52,_,55,_,53,_,57,_,48,_,55,_,50,_,57,_,53,_,57,_,43,_,50,_,48,_,55,_]},
 desert:{bpm:108,lead:'triangle',hat:1,mel:[74,_,75,74,72,_,70,72,74,_,_,77,75,74,72,_,70,72,74,75,77,_,75,74,72,70,69,_,70,_,_,_],bas:[50,_,57,_,50,_,57,_,48,_,55,_,48,_,55,_,46,_,53,_,46,_,53,_,45,_,52,_,50,_,_,_]},
 lava:{bpm:132,lead:'square',hat:1,mel:[76,76,79,76,74,76,71,_,76,76,79,81,83,81,79,_,72,72,76,72,71,72,67,_,74,74,78,74,71,_,_,_],bas:[40,40,52,40,40,40,52,40,40,40,52,40,40,40,52,40,36,36,48,36,36,36,48,36,38,38,50,38,35,35,47,35]},
 sky:{bpm:100,lead:'triangle',hat:0,mel:[79,_,83,_,86,_,83,_,84,_,81,_,79,_,_,_,76,_,79,_,83,_,81,79,78,_,74,_,79,_,_,_],bas:[55,_,62,_,59,_,62,_,57,_,64,_,60,_,64,_,52,_,59,_,55,_,59,_,50,_,57,_,55,_,62,_]},
 snow:{bpm:96,lead:'sine',hat:0,mel:[69,_,72,_,76,_,74,72,71,_,72,_,74,_,_,_,72,_,76,_,79,_,77,76,74,_,71,_,69,_,_,_],bas:[45,_,52,_,57,_,52,_,43,_,50,_,55,_,50,_,41,_,48,_,53,_,48,_,40,_,47,_,45,_,52,_]},
 night:{bpm:104,lead:'triangle',hat:1,mel:[62,_,65,69,_,67,65,_,64,_,62,_,61,_,_,_,62,_,65,69,72,_,70,69,67,_,65,64,62,_,_,_],bas:[38,_,_,45,38,_,_,45,37,_,_,45,37,_,_,45,34,_,_,41,34,_,_,41,33,_,_,40,38,_,_,_]},
 boss:{bpm:150,lead:'sawtooth',hat:1,mel:[64,67,71,67,64,67,71,74,72,71,67,64,66,67,66,63,64,67,71,76,74,71,72,71,69,67,66,67,64,_,64,_],bas:[40,52,40,52,40,52,40,52,36,48,36,48,35,47,35,47,40,52,40,52,40,52,40,52,36,48,38,50,40,52,40,52]}
};
let TR=TRACKS.menu,trName='menu';
function setTrack(n){const t=TRACKS[n];if(!t||n===trName)return;trName=n;TR=t;SP=60/t.bpm/2;step=0;if(mg&&mctx){try{const now=mctx.currentTime;mg.gain.cancelScheduledValues(now);mg.gain.setValueAtTime(0,now);mg.gain.linearRampToValueAtTime(vMus(),now+.6)}catch(e){}nextT=Math.max(nextT,mctx.currentTime+.08)}}
function note(f,t,d,type,v){const o=mctx.createOscillator(),g=mctx.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(mg);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.start(t);o.stop(t+d+.02)}
function hat(t,v){const n=mctx.createBufferSource(),b=mctx.createBuffer(1,mctx.sampleRate*.05,mctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
 const hp=mctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=6000;const g=mctx.createGain();g.gain.value=v;n.buffer=b;n.connect(hp);hp.connect(g);g.connect(mg);n.start(t)}
function tick(){if(!mctx)return;while(nextT<mctx.currentTime+.25){const M=TR.mel,Bs=TR.bas,i=step%M.length;
  if(M[i])note(mid(M[i]),nextT,SP*.9,TR.lead,TR.lead==='sawtooth'?.09:TR.lead==='sine'?.22:TR.lead==='triangle'?.24:.16);
  if(Bs[i%Bs.length])note(mid(Bs[i%Bs.length]),nextT,SP*1.6,'triangle',.3);
  if(TR.hat&&i%2===0)hat(nextT,.07);
  nextT+=SP;step++}}
function musicStart(){
 if(vMus()===0)return musicPause();
 try{if(!mctx){mctx=new (window.AudioContext||window.webkitAudioContext)();mg=mctx.createGain();mg.gain.value=vMus();mg.connect(mctx.destination);nextT=mctx.currentTime+.1}
  if(mctx.state!=='running'){const r=mctx.resume();if(r&&r.then)r.then(()=>{nextT=Math.max(nextT,mctx.currentTime+.05)})}if(!timer){nextT=Math.max(nextT,mctx.currentTime+.05);timer=setInterval(tick,60);if(!window.__kitMusToast){window.__kitMusToast=1;setTimeout(()=>{if(isPlaying())toast('🎵 الموسيقى تعمل — يمكنك إيقافها من زر 🔊')},500)}}started=true}catch(e){}}
function musicPause(){if(timer){clearInterval(timer);timer=null}if(mctx&&mctx.state==='running')mctx.suspend()}
function isPlaying(){return !!(mctx&&mctx.state==='running'&&timer)}
/* آيفون: يُفتح الصوت فقط داخل لمسة حقيقية (رفع الإصبع أو النقر)، ويجب تجاوز زر الصامت */
let silentEl=null;
function silentWav(){const sr=8000,n=800,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
 return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function unlockAudio(){
 try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
 try{if(!silentEl){silentEl=new Audio(silentWav());silentEl.loop=true;silentEl.setAttribute('playsinline','');silentEl.volume=0.01}const pr=silentEl.play();if(pr&&pr.catch)pr.catch(()=>{})}catch(e){}
 if(mctx&&mctx.state!=='running')try{mctx.resume()}catch(e){}
 outs.forEach(g=>{try{if(g.context.state!=='running')g.context.resume()}catch(e){}});
}
const gesture=()=>{unlockAudio();if(vMus()>0&&(!mctx||mctx.state!=='running'||!timer))musicStart()};
['pointerup','touchend','click','keydown'].forEach(ev=>addEventListener(ev,gesture,{passive:true,capture:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden)musicPause();else if(started&&vMus()>0)musicStart()});

function apply(){
 outs.forEach(g=>{try{g.gain.value=vSfx()}catch(e){}});
 if(mg)try{mg.gain.setTargetAtTime(vMus(),mctx.currentTime,.05)}catch(e){}
 if(vMus()===0)musicPause();else if(started)musicStart();
 document.documentElement.style.filter=S.bright===1?'':`brightness(${S.bright})`;
 const m=$k('kitMute');if(m){m.textContent=S.muted?'🔇':'🔊';m.setAttribute('aria-label',S.muted?'تشغيل الصوت':'كتم الصوت');m.classList.toggle('off',S.muted)}
}

 [523,659,784,1046].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(out);const t=c.currentTime+i*.1;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.22)});
 setTimeout(()=>{try{c.close()}catch(e){}},1200)}

/* ---------- حفظ ملف للجهاز ---------- */
async function saveFile(name,blob){
 try{const dl=window.claude&&claude.use?await claude.use('downloads'):null;if(dl){await dl.save({filename:name,data:blob});return true}}catch(e){if(e&&e.code==='declined')return false}
 try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}catch(e){return false}
}
function toast(t){let d=$k('kitToast');if(!d){d=document.createElement('div');d.id='kitToast';document.body.appendChild(d)}d.textContent=t;d.classList.add('on');clearTimeout(d._t);d._t=setTimeout(()=>d.classList.remove('on'),2600)}

function drawTree(x,bx,by,s,t,kind,seed){
 const w=Math.sin(t/520+seed),sway=w*0.13+Math.sin(t/230+seed*2)*0.025,rus=1+Math.sin(t/300+seed)*0.05;

 x.fillStyle=kind==='palm'?'#a1743d':'#7a4b2a';x.beginPath();x.moveTo(-5,0);x.quadraticCurveTo(-5+w*4,-24,-5+w*7,-46);x.lineTo(5+w*7,-46);x.quadraticCurveTo(5+w*4,-24,5,0);x.fill();
 x.translate(w*7,-44);x.rotate(sway);x.scale(rus,2-rus);
 if(kind==='palm'){x.fillStyle='#2e9e4f';x.strokeStyle='#2b1a0e';x.lineWidth=2.5;for(let k=0;k<6;k++){const fl=Math.sin(t/260+k+seed)*0.12,a=-Math.PI/2+(k-2.5)*0.55+sway*2+fl;x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(Math.cos(a)*24,Math.sin(a)*24-8,Math.cos(a)*42,Math.sin(a)*42+8);x.quadraticCurveTo(Math.cos(a)*22,Math.sin(a)*22+4,0,4);x.fill();x.stroke()}x.fillStyle='#8d5a2b';x.beginPath();x.arc(-4,4,4,0,7);x.arc(5,5,4,0,7);x.fill()}
 else{const bl=[[0,-26,26],[-20,-10,20],[20,-10,20]].map(([a,b,r],k)=>[a+Math.sin(t/300+k+seed)*1.6,b+Math.cos(t/340+k+seed)*1.4,r]);

function checkBadges(p,ctx){
 const had=new Set(p.badges),got=new Set(had);ctx=ctx||{};
 if(p.made)got.add('style');
 if(ctx.stageDone)got.add('first');
 if(ctx.stars===3)got.add('stars');
 if(ctx.clean)got.add('clean');
 if(ctx.bossBeaten)got.add('boss');
 if(ctx.gold3)got.add('gold3');if(p.maxCombo>=5)got.add('combo5');if(p.hardWins>=1)got.add('hard');if(ctx.review)got.add('review');if(p.gold>=30)got.add('gold30');
 if(p.stomps>=20)got.add('stomp');
 if(p.coinsTotal>=500)got.add('coins');
 if(p.treasures>=1)got.add('chest1');
 if(p.treasures>=5)got.add('chest5');
 const done=id=>p.prog[id]&&p.prog[id].done;
 if(WORLDS.some(w=>done(w.id)))got.add('world1');
 if(WORLDS.some(w=>p.prog[w.id]&&(p.prog[w.id].s||[]).reduce((a,b)=>a+(b||0),0)>=10))got.add('perfect');
 if(catWorlds('nahw').filter(w=>done(w.id)).length>=5)got.add('nahw');
 if(catWorlds('imla').filter(w=>done(w.id)).length>=3)got.add('imla');
 if(done('bossN'))got.add('kingN');if(done('bossI'))got.add('kingI');
 if(WORLDS.every(w=>done(w.id)))got.add('legend');
 p.badges=[...got];
 return BADGES.filter(b=>got.has(b.id)&&!had.has(b.id));
}

  app.querySelectorAll('.ro').forEach(b=>b.onclick=()=>{const ok=b.dataset.v===r.right;app.querySelectorAll('.ro').forEach(z=>{z.disabled=true;if(z.dataset.v===r.right)z.classList.add('good');else if(z===b)z.classList.add('bad')});
   if(window.onAnswer)onAnswer(r,ok);if(ok){good++;beep('ok')}else beep('no');

   $('rn').onclick=()=>{i++;show()};try{$('rn').focus()}catch(_){}})}

function ranking(all,opt){
 opt=opt||{};const since=opt.week?Date.now()-7*864e5:0;
 const rows=all.filter(r=>r&&r.name&&r.at>=since&&(!opt.cat||((WID(r.lesson)||{}).cat===opt.cat)));
 const best={},avOf={},lastAt={},last={};
 rows.forEach(r=>{const k=r.name+'|'+r.lesson+'|'+r.stage;const b=best[k];if(!b||r.correct>b.correct||(r.correct===b.correct&&(r.stars||0)>(b.stars||0)))best[k]=Object.assign({},r,{gold:Math.max(r.gold||0,b?b.gold||0:0)});else b.gold=Math.max(b.gold||0,r.gold||0);
  if(!last[r.name]||r.at>last[r.name])last[r.name]=r.at;if(r.av&&(!lastAt[r.name]||r.at>lastAt[r.name])){avOf[r.name]=r.av;lastAt[r.name]=r.at}});
 const P={};const pa=profAll();
 Object.values(best).forEach(r=>{const o=P[r.name]=P[r.name]||{name:r.name,score:0,correct:0,worlds:0,stars:0,gold:0,stages:0,hard:0};
  o.correct+=r.correct;o.stages+=r.win?1:0;o.stars+=r.stars||0;o.gold+=r.gold||0;if(r.win&&r.stage===2)o.worlds++;if(r.win&&r.diff===2)o.hard++});
 return Object.values(P).map(o=>Object.assign(o,{score:o.correct*10+o.worlds*30+o.stars*5+o.gold*3+o.hard*10,last:last[o.name],av:Object.assign({},DEF_AV,avOf[o.name]||(pa[o.name]&&pa[o.name].av)||{})})).sort((a,b)=>b.score-a.score||b.stars-a.stars||a.name.localeCompare(b.name,'ar'));
}

function drawFlower(x,cx,by,sc,F,t,o){o=o||{};const g=Math.max(0,Math.min(1,o.grow==null?1:o.grow)),wilt=o.wilt||0,seed=o.seed||0;
 if(g<=0)return;const sw=Math.sin(t/700+seed)*.08*(1-wilt),h=58*sc*g;
 x.save();x.translate(cx,by);x.rotate(sw+wilt*.35);
 x.strokeStyle=wilt?'#8d8b5a':'#3f9a46';x.lineWidth=4*sc;x.lineCap='round';x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(-6*sc,-h*.5,0,-h);x.stroke();
 x.fillStyle=wilt?'#9e9a62':'#56b860';[[-1,.45],[1,.65]].forEach(([d,p])=>{if(g<.4)return;x.save();x.translate(-3*sc*d,-h*p);x.rotate(d*.9);x.beginPath();x.ellipse(d*9*sc,0,10*sc,4.5*sc,0,0,7);x.fill();x.restore()});
 x.translate(0,-h);if(wilt)x.rotate(1.1);
 const r=(o.bud?6:14)*sc*Math.min(1,g*1.3),col=wilt?'#b9a58f':F.c,col2=wilt?'#8d7b66':F.c2;
 if(o.bud||g<.55){x.fillStyle=col;x.beginPath();x.ellipse(0,-r*.3,r*.7,r,0,0,7);x.fill();x.restore();return}
 if(F.k==='tulip'){x.fillStyle=col;x.beginPath();x.moveTo(-r,-r*.2);x.quadraticCurveTo(-r,r*.9,0,r*.9);x.quadraticCurveTo(r,r*.9,r,-r*.2);x.lineTo(r*.5,-r*.9);x.lineTo(0,-r*.3);x.lineTo(-r*.5,-r*.9);x.closePath();x.fill();x.fillStyle='rgba(255,255,255,.3)';x.beginPath();x.ellipse(-r*.35,0,r*.18,r*.5,0,0,7);x.fill()}
 else if(F.k==='lav'){x.fillStyle=col;for(let i=0;i<7;i++){x.beginPath();x.ellipse(Math.sin(i*1.7)*3*sc,-i*5*sc+r*.6,4.5*sc,3.5*sc,0,0,7);x.fill()}}
 else if(F.k==='rose'){[[1,col],[.72,col2],[.45,col]].forEach(([k,c2])=>{x.fillStyle=c2;x.beginPath();x.arc(0,0,r*k,0,7);x.fill()});x.strokeStyle='rgba(0,0,0,.18)';x.lineWidth=1.5*sc;x.beginPath();x.arc(0,0,r*.6,.5,4);x.stroke()}
 else{const n=F.k==='sun'?14:F.k==='lily'?6:8,pl=F.k==='sun'?r*1.15:F.k==='lily'?r*1.2:r;x.fillStyle=col;
  for(let i=0;i<n;i++){x.save();x.rotate(i/n*Math.PI*2+t/9000);x.beginPath();x.ellipse(0,-pl*.55,pl*(F.k==='lily'?.32:.26),pl*.55,0,0,7);x.fill();x.restore()}
  x.fillStyle=col2;x.beginPath();x.arc(0,0,r*(F.k==='sun'?.55:.32),0,7);x.fill();
  if(F.k==='sun'){x.fillStyle='rgba(0,0,0,.25)';for(let i=0;i<10;i++){x.beginPath();x.arc(Math.cos(i)*r*.3,Math.sin(i*1.3)*r*.3,1.4*sc,0,7);x.fill()}}}
 x.restore();
}
